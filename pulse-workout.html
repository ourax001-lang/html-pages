  const ov = $('#completeOverlay');
  ov.innerHTML = `<div class="celebrate-card" style="position:relative;overflow:hidden">
    ${confettiHTML(26)}
    ${cat('celebrate', 120)}
    <h2 style="font-size:26px;margin-top:6px">Workout Complete!</h2>
    <div class="grid-3" style="margin:18px 0 6px">
      <div class="stat-card" style="align-items:center"><span class="num">${fmtDur(e.duration)}</span><span class="lbl">Duration</span></div>
      <div class="stat-card" style="align-items:center"><span class="num">${e.sets}</span><span class="lbl">Sets</span></div>
      <div class="stat-card" style="align-items:center"><span class="num">${fmtVol(e.volume)}</span><span class="lbl">${wU()} volume</span></div>
    </div>
    ${e.prCount ? `<div class="badge badge-new" style="font-size:13px;padding:9px 14px">${ic('pr')} ${e.prCount} new PR${e.prCount > 1 ? 's' : ''}</div>` : ''}
    <button class="btn btn-primary" style="margin-top:18px" onclick="$('#completeOverlay').classList.remove('show');go('home')">Done</button>
    <button class="btn btn-sm btn-ghost" style="margin-top:8px" onclick="$('#completeOverlay').classList.remove('show');go('historyDetail','${e.id}')">View details</button>
  </div>`;
  ov.classList.add('show');
  chime();
}
</script>
<script>
/* ============================================================
   TIMER
   ============================================================ */
let _timerTick = null;
function renderTimer() {
  const t = state.timer;
  const c = 2 * Math.PI * 101;
  return `
  <div class="row" style="margin-bottom:6px">
    <button class="icon-button" onclick="go('home')" aria-label="Back">${ic('back')}</button>
    <div class="grow"></div>
    <button class="icon-button sm" onclick="tReset()" aria-label="Reset">${ic('history')}</button>
  </div>
  <div class="screen-header" style="text-align:center"><h1>Timer</h1><p>Set it and forget it.</p></div>
  <div class="timer-circle pulse-ring" style="color:var(--teal-deep)">
    <svg viewBox="0 0 230 230">
      <circle class="tc-bg" cx="115" cy="115" r="101" style="stroke:#EFE6CB"/>
      <circle class="tc-ring" id="tRing" cx="115" cy="115" r="101" stroke="#33685C" stroke-dasharray="${c}" stroke-dashoffset="0"/>
    </svg>
    <div class="tc-val" id="tVal">${mmss(t.rem)}</div>
    <div class="tc-sub" style="color:var(--teal)">remaining</div>
  </div>
  <div class="row" style="gap:10px;margin-top:22px">
    <button class="btn btn-primary" id="tBtn" style="flex:1" onclick="tToggle()">${t.running ? ic('pause') + ' PAUSE' : ic('play') + ' START'}</button>
    <button class="btn btn-ghost" style="flex:1" onclick="tReset()">${ic('history')} RESET</button>
  </div>
  <div class="section-label">${ic('sets')} Presets</div>
  <div class="chip-row">
    ${[30, 60, 90, 120, 180, 300].map(s => `<button class="chip" onclick="tSet(${s})">${s < 60 ? s + ' sec' : (s / 60) + ' min'}</button>`).join('')}
  </div>
  <div class="section-label">${ic('edit')} Custom</div>
  <div class="card row" style="gap:10px">
    <input id="tCustom" type="number" min="1" inputmode="numeric" placeholder="Seconds" style="flex:1;border:2px solid #EFE6CB;border-radius:14px;padding:12px 14px;font-weight:700;outline:none" aria-label="Custom seconds">
    <button class="btn btn-sm btn-secondary" onclick="tCustomSet()">SET</button>
  </div>`;
}
function timerUI(rem) {
  const t = state.timer, c = 2 * Math.PI * 101;
  const v = $('#tVal'), r = $('#tRing'), b = $('#tBtn');
  if (v) v.textContent = mmss(rem);
  if (r) r.style.strokeDashoffset = c * (1 - rem / Math.max(t.dur, 1));
  if (b) b.innerHTML = t.running ? ic('pause') + ' PAUSE' : ic('play') + ' START';
}
function tTick() {
  const t = state.timer;
  t.rem = Math.max(0, Math.round((t.endsAt - Date.now()) / 1000));
  timerUI(t.rem);
  if (t.rem <= 0) { t.running = false; clearInterval(_timerTick); _timerTick = null; chime(); toast('Time is up!'); }
}
function tToggle() {
  const t = state.timer;
  if (t.running) { t.running = false; clearInterval(_timerTick); _timerTick = null; }
  else {
    if (t.rem <= 0) t.rem = t.dur;
    t.running = true; t.endsAt = Date.now() + t.rem * 1000;
    _timerTick = setInterval(tTick, 250);
  }
  timerUI(t.rem);
}
function tSet(sec) { state.timer = { dur: sec, rem: sec, running: false }; if (_timerTick) { clearInterval(_timerTick); _timerTick = null; } render(); }
function tCustomSet() { const v = parseInt($('#tCustom').value); if (v > 0) tSet(clamp(v, 1, 3600)); }
function tReset() { tSet(state.timer.dur || 90); }

/* ============================================================
   STOPWATCH
   ============================================================ */
let _swTick = null;
const swNow = () => state.stopwatch.acc + (state.stopwatch.running ? Date.now() - state.stopwatch.start : 0);
const swFmt = ms => pad2(Math.floor(ms / 60000)) + ':' + pad2(Math.floor(ms / 1000) % 60) + '.' + pad2(Math.floor(ms / 10) % 100);
function renderStopwatch() {
  const sw = state.stopwatch;
  return `
  <div class="row" style="margin-bottom:6px">
    <button class="icon-button" onclick="go('home')" aria-label="Back">${ic('back')}</button>
    <div class="grow"></div>
    <button class="icon-button sm" onclick="swReset()" aria-label="Reset">${ic('history')}</button>
  </div>
  <div class="screen-header" style="text-align:center"><h1>Stopwatch</h1><p>Lap it like you mean it.</p></div>
  <div class="timer-circle pulse-ring" style="color:var(--teal-deep)">
    <svg viewBox="0 0 230 230"><circle class="tc-bg" cx="115" cy="115" r="101" style="stroke:#EFE6CB"/></svg>
    <div class="tc-val" id="swVal" style="font-size:44px">${swFmt(swNow())}</div>
  </div>
  <div class="row" style="gap:10px;margin-top:22px">
    <button class="btn btn-primary" id="swBtn" style="flex:1" onclick="swToggle()">${sw.running ? ic('pause') + ' PAUSE' : ic('play') + ' START'}</button>
    <button class="btn btn-secondary" style="flex:1" onclick="swLap()">${ic('lap')} LAP</button>
    <button class="icon-button" style="width:56px;height:56px" onclick="swReset()" aria-label="Reset stopwatch">${ic('history')}</button>
  </div>
  <div class="section-label">${ic('lap')} Laps</div>
  <div id="swLaps">${sw.laps.length ? sw.laps.map((l, i) => `
    <div class="kv" style="border-bottom:2px solid var(--line)">
      <span>Lap ${i + 1}</span><b style="font-variant-numeric:tabular-nums">${swFmt(l)}</b>
    </div>`).join('') : `<p class="muted" style="text-align:center;padding:14px">No laps yet — tap LAP while running.</p>`}
  </div>`;
}
function swUI() { const el = $('#swVal'); if (el) el.textContent = swFmt(swNow()); }
function swToggle() {
  const sw = state.stopwatch;
  if (sw.running) { sw.acc = swNow(); sw.running = false; clearInterval(_swTick); _swTick = null; }
  else { sw.start = Date.now(); sw.running = true; _swTick = setInterval(swUI, 53); }
  const b = $('#swBtn'); if (b) b.innerHTML = sw.running ? ic('pause') + ' PAUSE' : ic('play') + ' START';
}
function swLap() {
  const sw = state.stopwatch;
  if (!sw.running && sw.acc === 0) { toast('Start the stopwatch first', 'warning'); return; }
  sw.laps.push(swNow()); render();
}
function swReset() {
  state.stopwatch = { start: 0, acc: 0, running: false, laps: [] };
  if (_swTick) { clearInterval(_swTick); _swTick = null; }
  render(); toast('Stopwatch reset');
}

/* ============================================================
   ALARMS
   ============================================================ */
const DAYS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
function renderAlarms() {
  return `
  <div class="row" style="margin-bottom:6px">
    <button class="icon-button" onclick="go('home')" aria-label="Back">${ic('back')}</button>
    <div class="grow"></div>
    <button class="icon-button sm" onclick="openAlarmSheet()" aria-label="Add alarm">${ic('add')}</button>
  </div>
  <div class="screen-header" style="text-align:center"><h1>Alarms</h1><p>Gentle nudges, on your schedule.</p></div>
  ${state.alarms.length ? state.alarms.map(al => `
    <div class="alarm-row ${al.enabled ? '' : 'off'}">
      <div class="grow">
        <div class="time">${fmt12(al.hh, al.mm)}</div>
        <b style="font-size:14px">${esc(al.name)}</b>
        <div class="muted" style="margin-top:3px">${al.days.length === 7 ? 'Every day' : al.days.length === 0 ? 'One-time' : al.days.map(d => DAYS[d]).join(' ')}</div>
      </div>
      <button class="switch ${al.enabled ? 'on' : ''}" onclick="toggleAlarm('${al.id}')" aria-label="Toggle alarm" role="switch" aria-checked="${al.enabled}"></button>
      <button class="icon-button sm" onclick="openAlarmSheet('${al.id}')" aria-label="Edit alarm">${ic('edit')}</button>
      <button class="icon-button sm" style="color:var(--brick)" onclick="askDeleteAlarm('${al.id}')" aria-label="Delete alarm">${ic('trash')}</button>
    </div>`).join('')
  : `<div class="card empty">${cat('recovery', 90)}<h4>No alarms yet.</h4><p>Set one for your morning sessions.</p>
     <button class="btn btn-primary" style="width:auto" onclick="openAlarmSheet()">${ic('add')} Add alarm</button></div>`}
  <button class="btn btn-secondary" style="margin-top:14px" onclick="openAlarmSheet()">${ic('add')} ADD ALARM</button>`;
}
function openAlarmSheet(alarmId) {
  const al = alarmId ? state.alarms.find(a => a.id === alarmId) : null;
  _sheetCtx = { alarmId: alarmId || null };
  openSheet(`
    <div class="sheet-title-row row">
      <h3 style="margin:0">${al ? 'Edit alarm' : 'Add alarm'}</h3>
      <button class="icon-button sm" onclick="closeSheet()" aria-label="Close">${ic('close')}</button>
    </div>
    <div class="field-row">
      <div class="field"><label for="alTime">Time</label>
        <input id="alTime" type="time" value="${pad2(al ? al.hh : 6)}:${pad2(al ? al.mm : 30)}" style="font-size:22px;font-weight:800;padding:14px 15px">
        <p class="muted" style="margin-top:7px;font-size:12px">Pick a time like 6:30 PM or 7:45 AM</p></div>
    </div>
    <div class="field"><label for="alName">Alarm name</label><input id="alName" placeholder="Morning Workout" value="${al ? esc(al.name) : ''}"></div>
    <div class="field"><label>Repeat days</label>
      <div class="day-pills">${DAYS.map((d, i) => `<button class="day-pill ${al && al.days.includes(i) ? 'on' : ''}" id="dayp-${i}" onclick="this.classList.toggle('on')" aria-label="Toggle ${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][i]}">${d}</button>`).join('')}</div>
    </div>
    <button class="btn btn-primary" onclick="saveAlarm()">${ic('save')} Save alarm</button>`);
}
function saveAlarm() {
  const tv = ($('#alTime').value || '06:30').split(':');
  const hh = clamp(parseInt(tv[0]) || 0, 0, 23), mm = clamp(parseInt(tv[1]) || 0, 0, 59);
  const name = $('#alName').value.trim() || 'Workout';
  const days = DAYS.map((d, i) => $('#dayp-' + i).classList.contains('on') ? i : -1).filter(i => i >= 0);
  if (_sheetCtx.alarmId) {
    Object.assign(state.alarms.find(a => a.id === _sheetCtx.alarmId), { hh, mm, name, days });
    toast('Alarm saved');
  } else {
    state.alarms.push({ id: uid(), hh, mm, name, days, enabled: true });
    toast('Alarm saved');
  }
  persist(); closeSheet(); render();
}
function toggleAlarm(id) { const a = state.alarms.find(x => x.id === id); a.enabled = !a.enabled; persist(); render(); }
function askDeleteAlarm(id) {
  confirmSheet('Delete alarm?', 'This alarm will be removed.', 'Delete', () => {
    state.alarms = state.alarms.filter(a => a.id !== id); persist(); toast('Alarm deleted'); closeSheet(); render();
  });
}
/* alarm engine — checks every 20s while the app is open */
let _lastAlarmMin = '';
function checkAlarms() {
  const now = new Date(), key = now.getHours() + ':' + now.getMinutes();
  if (key === _lastAlarmMin) return;
  const hit = state.alarms.find(a => a.enabled && a.hh === now.getHours() && a.mm === now.getMinutes() && (a.days.length === 0 || a.days.includes(now.getDay())));
  if (hit) { _lastAlarmMin = key; ringAlarm(hit); }
}
function ringAlarm(al) {
  const ov = $('#alarmOverlay');
  ov.innerHTML = `
    <div class="cat-bob">${cat('main', 120)}</div>
    <h2 style="color:#fff;font-size:30px;font-weight:800;margin-top:12px">${fmt12(al.hh, al.mm)}</h2>
    <p style="color:#fff;font-weight:800;font-size:16px;opacity:.9;margin:2px 0 22px">${esc(al.name)} — time to move!</p>
    <button class="btn btn-primary" style="max-width:280px" onclick="dismissAlarm()">${ic('check')} I'm up!</button>`;
  ov.classList.add('show');
  chime(); setTimeout(() => { if ($('#alarmOverlay').classList.contains('show')) chime(); }, 1600);
}
function dismissAlarm() { $('#alarmOverlay').classList.remove('show'); toast('Have a great session!'); }
/* ============================================================
   PROGRESS
   ============================================================ */
function renderProgress() {
  const H = state.history;
  const now = new Date();
  const weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 6);
  const monthAgo = new Date(now.getFullYear(), now.getMonth(), 1);
  const thisWeek = H.filter(h => new Date(h.ts) >= weekAgo).length;
  const thisMonth = H.filter(h => new Date(h.ts) >= monthAgo).length;
  const totalSecs = H.reduce((a, h) => a + h.duration, 0);
  const streak = calcStreak();
  const prCount = Object.keys(state.prs).length;
  return `
  <div class="screen-header"><h1>Progress</h1><p>Small steps, big progress ${'<3'.replace('<3', '♥')}</p></div>

  <div class="grid-2">
    <div class="stat-card"><span class="num" style="color:var(--rose-deep)">${H.length}</span><span class="lbl">Total workouts</span></div>
    <div class="stat-card"><span class="num" style="color:var(--teal)">${thisWeek}</span><span class="lbl">This week</span></div>
    <div class="stat-card"><span class="num" style="color:#D9A417">${thisMonth}</span><span class="lbl">This month</span></div>
    <div class="stat-card"><span class="num" style="color:#8A6FB0">${streak}d</span><span class="lbl">Current streak</span></div>
  </div>
  <div class="card row" style="margin-top:12px;gap:14px">
    <span class="split-ico acc-pull">${ic('timer')}</span>
    <div class="grow"><b style="font-size:17px">${fmtDur(totalSecs)}</b><div class="muted">Total training time</div></div>
  </div>

  <div class="section-label">${ic('chart')} Weekly activity</div>
  <div class="progress-card">
    <div class="bars">
      ${[...Array(7)].map((_, i) => {
        const d = new Date(now); d.setDate(now.getDate() - (6 - i));
        const cnt = H.filter(h => h.iso === isoDay(d)).length;
        const h = cnt ? clamp(18 + cnt * 26, 20, 100) : 7;
        const lbl = ['S', 'M', 'T', 'W', 'T', 'F', 'S'][d.getDay()];
        return `<div class="bar-col"><div class="bar ${d.toDateString() === now.toDateString() ? 'hot' : ''}" style="height:${h}%"></div><span class="bar-lbl">${lbl}</span></div>`;
      }).join('')}
    </div>
  </div>

  <div class="section-label">${ic('sets')} Split distribution</div>
  <div class="progress-card">${donutChart()}</div>

  <div class="section-label">${ic('chart')} Training frequency</div>
  <div class="progress-card">
    <div class="bars" style="height:86px">
      ${[...Array(6)].map((_, i) => {
        const end = new Date(now); end.setDate(now.getDate() - i * 7);
        const start = new Date(end); start.setDate(end.getDate() - 6);
        const cnt = H.filter(h => { const t = new Date(h.ts); return t >= start && t <= end; }).length;
        return `<div class="bar-col"><div class="bar ${i === 0 ? 'hot' : ''}" style="height:${cnt ? clamp(20 + cnt * 24, 20, 100) : 7}%"></div><span class="bar-lbl">${i === 0 ? 'now' : '-' + (i + 1) + 'w'}</span></div>`;
      }).join('')}
    </div>
  </div>

  <div class="section-label">${ic('pr')} Personal records</div>
  ${prListHTML()}

  <div class="section-label">${ic('history')} Workout history</div>
  ${H.length ? `
    <button class="btn btn-secondary" onclick="go('history')">${ic('history')} View all ${H.length} workouts</button>`
  : `<div class="card empty">${cat('recovery', 84)}<h4>Nothing tracked yet.</h4><p>Finish a workout to see it here.</p></div>`}`;
}
function donutChart() {
  const counts = { push: 0, pull: 0, legs: 0, custom: 0 };
  state.history.forEach(h => counts[h.split] !== undefined ? counts[h.split]++ : counts.custom++);
  const total = state.history.length;
  const colors = { push: '#C98A96', pull: '#8FA982', legs: '#D9BC75', custom: '#A392C4' };
  if (!total) return `<div class="empty" style="padding:18px">${cat('resting', 70)}<h4 style="font-size:15px">No data yet</h4><p>Complete workouts to see your split balance.</p></div>`;
  const R = 56, C = 2 * Math.PI * R;
  let off = 0, segs = '';
  Object.entries(counts).forEach(([k, v]) => {
    if (!v) return;
    const frac = v / total;
    segs += `<circle cx="75" cy="75" r="${R}" fill="none" stroke="${colors[k]}" stroke-width="22"
      stroke-dasharray="${C * frac - 2} ${C - C * frac + 2}" stroke-dashoffset="${-off}" stroke-linecap="round"/>`;
    off += C * frac;
  });
  return `<div class="row" style="gap:18px;flex-wrap:wrap;justify-content:center">
    <div style="position:relative;width:150px;height:150px;flex:none">
      <svg width="150" height="150" viewBox="0 0 150 150" style="transform:rotate(-90deg)">
        <circle cx="75" cy="75" r="56" fill="none" stroke="#F0E9D2" stroke-width="22"/>${segs}</svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <b style="font-size:26px">${total}</b><span class="muted" style="font-size:10.5px;font-weight:800;letter-spacing:1px">WORKOUTS</span>
      </div>
    </div>
    <div class="legend" style="flex-direction:column;gap:9px">
      ${Object.entries(counts).map(([k, v]) => `<span class="lg"><span class="dot" style="background:${colors[k]}"></span>${k.toUpperCase()} — ${v} (${Math.round(v / total * 100)}%)</span>`).join('')}
    </div>
  </div>`;
}
function prListHTML() {
  const entries = Object.entries(state.prs).filter(([n, p]) => p.bestSet && (p.bestSet.w > 0 || p.bestSet.r > 0));
  if (!entries.length) return `<div class="card empty">${cat('trophy', 92)}<h4>Your PR shelf is waiting.</h4><p>Push a little harder next session.</p></div>`;
  entries.sort((a, b) => (b[1].bestSetDate || '').localeCompare(a[1].bestSetDate || ''));
  return entries.map(([name, p]) => {
    const isNew = p.bestSetDate === isoDay();
    return `<div class="pr-row">
      <span class="pr-ico">${ic('pr')}</span>
      <div class="grow">
        <div class="row"><b style="font-size:14.5px">${esc(name)}</b>${isNew ? '<span class="badge badge-new">NEW PR</span>' : ''}</div>
        <div class="muted">Best ${p.bestSet.w ? fmtW(p.bestSet.w) + ' ' + wU() + ' × ' + p.bestSet.r : p.bestSet.r + ' reps'} · volume ${fmtVol(p.volume || 0)} ${wU()}</div>
      </div>
      <span class="muted" style="white-space:nowrap">${p.bestSetDate ? prettyDate(new Date(p.bestSetDate + 'T12:00')) : ''}</span>
    </div>`;
  }).join('');
}

/* ============================================================
   HISTORY
   ============================================================ */
function renderHistory() {
  const H = [...state.history].reverse();
  return `
  <div class="row" style="margin-bottom:6px">
    <button class="icon-button" onclick="go('progress')" aria-label="Back">${ic('back')}</button>
  </div>
  <div class="screen-header"><h1>Workout History</h1><p>${state.history.length} workouts in the bag.</p></div>
  ${H.length ? H.map(h => `
    <div class="hist-item" onclick="go('historyDetail','${h.id}')">
      <div class="row">
        <span class="split-ico ${splitMeta(h.split).cls}" style="width:46px;height:46px;border-radius:15px">${ic(splitMeta(h.split).icon)}</span>
        <div class="grow">
          <b>${esc(h.name)}</b>
          <div class="muted">${h.dateLabel} · ${new Date(h.ts).toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit'})}</div>
          <div class="row" style="gap:6px;margin-top:6px">
            <span class="pill ${splitMeta(h.split).cls}">${fmtDur(h.duration)}</span>
            <span class="pill" style="background:#F6F0DC;color:#8A8262">${h.sets} sets</span>
            <span class="pill" style="background:#F6F0DC;color:#8A8262">${fmtVol(h.volume)} ${wU()}</span>
            ${h.prCount ? `<span class="badge badge-new">${h.prCount} PR${h.prCount > 1 ? 's' : ''}</span>` : ''}
          </div>
        </div>
        ${ic('chevron')}
      </div>
    </div>`).join('')
  : `<div class="card empty">${cat('resting', 90)}<h4>No workouts yet.</h4><p>Your history starts with your first session.</p></div>`}`;
}
function renderHistoryDetail() {
  const h = state.history.find(x => x.id === state.param);
  if (!h) { go('history'); return ''; }
  const m = splitMeta(h.split);
  return `
  <div class="row" style="margin-bottom:6px">
    <button class="icon-button" onclick="go('history')" aria-label="Back">${ic('back')}</button>
    <div class="grow"></div>
    <button class="icon-button sm" style="color:var(--brick)" onclick="askDeleteHistory('${h.id}')" aria-label="Delete entry">${ic('trash')}</button>
  </div>
  <div class="screen-header">
    <span class="pill ${m.cls}" style="margin-bottom:8px">${m.label}</span>
    <h1>${esc(h.name)}</h1>
    <p>${h.dateLabel} · ${new Date(h.ts).toLocaleTimeString('en-IN', {hour: '2-digit', minute: '2-digit'})}</p>
  </div>
  <div class="grid-3">
    <div class="stat-card" style="align-items:center"><span class="num">${fmtDur(h.duration)}</span><span class="lbl">Duration</span></div>
    <div class="stat-card" style="align-items:center"><span class="num">${h.sets}</span><span class="lbl">Sets</span></div>
    <div class="stat-card" style="align-items:center"><span class="num">${fmtVol(h.volume)}</span><span class="lbl">${wU()} volume</span></div>
  </div>
  ${h.prCount ? `<div class="card row" style="margin-top:12px;gap:12px;background:var(--must-soft)">
    <span class="pr-ico" style="width:44px;height:44px;border-radius:15px;background:var(--mustard);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--ink)">${ic('pr')}</span>
    <div><b>${h.prCount} new PR${h.prCount > 1 ? 's' : ''} this session</b>
    <div class="muted">${h.prNames.map(esc).join(' · ')}</div></div>
  </div>` : ''}
  <button class="btn btn-ghost" style="margin-top:12px" onclick="shareSummary('${h.id}')">${ic('share')} COPY SUMMARY</button>
  <div class="section-label">${ic('notes')} Exercises</div>
  ${h.exercises.map(e => `
    <div class="exercise-card" style="margin-bottom:10px">
      <b style="font-size:15px">${esc(e.name)}</b>
      <div class="muted" style="margin:2px 0 10px">Target ${esc(e.targetReps)} reps</div>
      ${e.sets.map((s, i) => `
        <div class="kv" style="border-bottom:2px solid var(--line)">
          <span>Set ${i + 1}</span>
          <b>${s.reps} reps · ${fmtW(s.weight)} ${wU()}</b>
        </div>`).join('')}
    </div>`).join('')}`;
}
function askDeleteHistory(id) {
  confirmSheet('Delete this entry?', 'It will be removed from your history. PRs stay.', 'Delete', () => {
    state.history = state.history.filter(h => h.id !== id); persist();
    toast('Entry deleted'); closeSheet(); go('history');
  });
}

/* ============================================================
   PROFILE
   ============================================================ */
function renderProfile() {
  const p = state.profile, s = state.settings;
  return `
  <div class="screen-header row" style="gap:16px">
    <div class="cat-bob">${cat('profile', 96)}</div>
    <div class="grow">
      <h1>${esc(p.name)}</h1>
      <p>Beginner · Level ${level()}</p>
    </div>
  </div>
  <div class="grid-3">
    <div class="stat-card" style="align-items:center"><span class="num">${totalWorkouts()}</span><span class="lbl">Workouts</span></div>
    <div class="stat-card" style="align-items:center"><span class="num">${calcStreak()}d</span><span class="lbl">Streak</span></div>
    <div class="stat-card" style="align-items:center"><span class="num">${Object.keys(state.prs).length}</span><span class="lbl">PRs</span></div>
  </div>

  <div class="section-label">${ic('settings')} Settings</div>
  <div class="card" style="padding:6px 18px">
    <div class="row" style="padding:13px 0;border-bottom:2px solid var(--line)">
      <span class="split-ico acc-pull" style="width:40px;height:40px;border-radius:13px">${ic('weight')}</span>
      <div class="grow"><b style="font-size:14.5px">Units</b><div class="muted">KG / CM or LB</div></div>
      <button class="switch ${isKg() ? 'on' : ''}" onclick="toggleUnits()" aria-label="Toggle units" role="switch" aria-checked="${isKg()}"></button>
    </div>
    <div class="row" style="padding:13px 0;border-bottom:2px solid var(--line)">
      <span class="split-ico acc-push" style="width:40px;height:40px;border-radius:13px">${ic('sound')}</span>
      <div class="grow"><b style="font-size:14.5px">Sound</b><div class="muted">Beeps for rest, PRs & alarms</div></div>
      <button class="switch ${s.sound ? 'on' : ''}" onclick="toggleSetting('sound')" aria-label="Toggle sound" role="switch" aria-checked="${s.sound}"></button>
    </div>
    <div class="row" style="padding:13px 0;border-bottom:2px solid var(--line)">
      <span class="split-ico acc-legs" style="width:40px;height:40px;border-radius:13px">${ic('rest')}</span>
      <div class="grow"><b style="font-size:14.5px">Auto rest timer</b><div class="muted">Start rest after each set</div></div>
      <button class="switch ${s.autoRest ? 'on' : ''}" onclick="toggleSetting('autoRest')" aria-label="Toggle auto rest" role="switch" aria-checked="${s.autoRest}"></button>
    </div>
    <div class="row" style="padding:13px 0">
      <span class="split-ico acc-custom" style="width:40px;height:40px;border-radius:13px">${ic('timer')}</span>
      <div class="grow"><b style="font-size:14.5px">Default rest</b><div class="muted">Used when timer opens</div></div>
      <div class="chip-row">
        ${[60, 90, 120].map(v => `<button class="chip ${s.restDefault === v ? 'on' : ''}" onclick="setRestDefault(${v})">${v}s</button>`).join('')}
      </div>
    </div>
  </div>

  <div class="section-label">${ic('sun')} Customise</div>
  <div class="card" style="padding:6px 18px">
    <button class="row tap" style="width:100%;padding:13px 0" onclick="openAppearanceSheet()">
      ${ic('sun')}<div class="grow" style="text-align:left;margin-left:10px"><b style="font-size:14.5px">Appearance & motion</b><div class="muted">${BG_COLORS.length} backgrounds · ${FONTS.length} fonts · sliders</div></div>${ic('chevron')}
    </button>
  </div>

  <div class="section-label">${ic('profile')} Account</div>
  <div class="card" style="padding:6px 18px">
    <button class="row tap" style="width:100%;padding:13px 0;border-bottom:2px solid var(--line)" onclick="openProfileSheet()">
      ${ic('edit')}<div class="grow" style="text-align:left;margin-left:10px"><b style="font-size:14.5px">Edit profile</b><div class="muted">Change your name</div></div>${ic('chevron')}
    </button>
    <button class="row tap" style="width:100%;padding:13px 0;border-bottom:2px solid var(--line)" onclick="exportData()">
      ${ic('share')}<div class="grow" style="text-align:left;margin-left:10px"><b style="font-size:14.5px">Export data</b><div class="muted">Copy a backup to clipboard</div></div>${ic('chevron')}
    </button>
    <button class="row tap" style="width:100%;padding:13px 0;border-bottom:2px solid var(--line)" onclick="openImportSheet()">
      ${ic('save')}<div class="grow" style="text-align:left;margin-left:10px"><b style="font-size:14.5px">Import data</b><div class="muted">Paste a PULSE backup</div></div>${ic('chevron')}
    </button>
    <button class="row tap" style="width:100%;padding:13px 0" onclick="askResetData()">
      ${ic('warning')}<div class="grow" style="text-align:left;margin-left:10px"><b style="font-size:14.5px;color:var(--brick)">Reset data</b><div class="muted">Erase everything, start fresh</div></div>${ic('chevron')}
    </button>
  </div>
  <p class="center muted" style="margin-top:22px">PULSE — made with ${ic('heart')} for your small steps.<br>Small steps, big progress ♥</p>`;
}
function toggleUnits() { state.settings.units = isKg() ? 'lb' : 'kg'; persist(); render(); toast('Units: ' + wU().toUpperCase()); }
function toggleSetting(k) { state.settings[k] = !state.settings[k]; persist(); render(); }
function setRestDefault(v) { state.settings.restDefault = v; state.timer = { dur: v, rem: v, running: false }; persist(); render(); }
function openProfileSheet() {
  openSheet(`
    <div class="sheet-title-row row">
      <h3 style="margin:0">Edit profile</h3>
      <button class="icon-button sm" onclick="closeSheet()" aria-label="Close">${ic('close')}</button>
    </div>
    <div style="text-align:center;margin-bottom:8px">${cat('profile', 90)}</div>
    <div class="field"><label for="pName">Your name</label><input id="pName" value="${esc(state.profile.name)}" placeholder="Your name"></div>
    <button class="btn btn-primary" onclick="saveProfile()">${ic('save')} Save</button>`);
}
function saveProfile() {
  const n = $('#pName').value.trim();
  if (!n) { toast('Enter a name', 'warning'); return; }
  state.profile.name = n; persist(); closeSheet(); render(); toast('Profile saved');
}

/* ---------- appearance & motion customisation ---------- */
const f2 = v => String(Math.round(v * 100) / 100).replace(/\.?0+$/, '') + '×';
function openAppearanceSheet() {
  const s = state.settings;
  openSheet(`
    <div class="sheet-title-row row">
      <h3 style="margin:0">Appearance & motion</h3>
      <button class="icon-button sm" onclick="closeSheet()" aria-label="Close">${ic('close')}</button>
    </div>
    <div class="field"><label>Background colour · ${BG_COLORS.length} shades</label>
      <div class="swatches">
        ${BG_COLORS.map(c => `<button class="swatch ${s.bg === c ? 'on' : ''}" style="background:${c}" onclick="setTheme('bg','${c}')" aria-label="Background ${c}"></button>`).join('')}
      </div></div>
    <div class="field"><label>Font · ${FONTS.length} families</label>
      ${FONTS.map((f, i) => `<button class="font-row ${s.font === i ? 'on' : ''}" onclick="setTheme('font',${i})">
        <span class="fprev" style="font-family:${esc(f.stack)}">Aa</span>
        <span class="fname grow" style="font-family:${esc(f.stack)}">${esc(f.name)}</span>
        ${s.font === i ? ic('check') : ''}
      </button>`).join('')}
    </div>
    <div class="slider-row"><div class="sr-head"><b>Roundness</b><span id="slR">${f2(s.rscale == null ? 1 : s.rscale)}</span></div>
      <input type="range" min="0.5" max="1.6" step="0.05" value="${s.rscale == null ? 1 : s.rscale}" oninput="setTheme('rscale', this.value)" aria-label="Roundness"></div>
    <div class="slider-row"><div class="sr-head"><b>Shadow depth</b><span id="slS">${f2(s.sh == null ? 1 : s.sh)}</span></div>
      <input type="range" min="0" max="2" step="0.05" value="${s.sh == null ? 1 : s.sh}" oninput="setTheme('sh', this.value)" aria-label="Shadow depth"></div>
    <div class="slider-row"><div class="sr-head"><b>Animation intensity</b><span id="slJ">${s.jig == 0 ? 'off' : f2(s.jig == null ? 1 : s.jig)}</span></div>
      <input type="range" min="0" max="1.5" step="0.5" value="${s.jig == null ? 1 : s.jig}" oninput="setTheme('jig', this.value)" aria-label="Animation intensity"></div>
    <div class="slider-row"><div class="sr-head"><b>Animation speed</b><span id="slP">${f2(s.spd || 1)}</span></div>
      <input type="range" min="0.5" max="2" step="0.1" value="${s.spd || 1}" oninput="setTheme('spd', this.value)" aria-label="Animation speed"></div>
    <button class="btn btn-ghost" onclick="resetTheme()">${ic('history')} Reset to defaults</button>`);
}
function setTheme(key, val) {
  const s = state.settings;
  if (key === 'font' || key === 'bg') s[key] = val; else s[key] = parseFloat(val);
  applyTheme(); persist();
  if (key === 'font' || key === 'bg') {
    const sh = $('#sheet'), sc = sh && sh.scrollTop || 0;
    openAppearanceSheet();
    const sh2 = $('#sheet'); if (sh2) sh2.scrollTop = sc; /* keep scroll position */
    return;
  }
  const lbl = { rscale: 'slR', sh: 'slS', jig: 'slJ', spd: 'slP' }[key];
  const el = $('#' + lbl);
  if (el) el.textContent = key === 'jig' && s.jig === 0 ? 'off' : f2(s[key]);
}
function resetTheme() {
  Object.assign(state.settings, { bg: BG_COLORS[0], font: 0, rscale: 1, sh: 1, jig: 1, spd: 1 });
  applyTheme(); persist(); openAppearanceSheet(); toast('Theme reset');
}

/* ---------- share / export / import ---------- */
function copyText(t) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t); return true; }
    const ta = document.createElement('textarea');
    ta.value = t; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
function shareSummary(id) {
  const h = state.history.find(x => x.id === id); if (!h) return;
  const lines = [
    'PULSE — ' + h.name + ' (' + h.dateLabel + ')',
    fmtDur(h.duration) + ' · ' + h.sets + ' sets · ' + fmtVol(h.volume) + ' ' + wU() + ' volume' +
      (h.prCount ? ' · ' + h.prCount + ' new PR' + (h.prCount > 1 ? 's' : '') : '')
  ];
  h.exercises.forEach(e => {
    if (e.sets.length) lines.push('• ' + e.name + ': ' + e.sets.map(s => s.reps + '×' + fmtW(s.weight) + wU()).join(', '));
  });
  copyText(lines.join('\n')) ? toast('Summary copied — share it!') : toast('Could not copy', 'warning');
}
function exportData() {
  const backup = {
    app: 'PULSE', v: 3,
    profile: state.profile, workouts: state.workouts, history: state.history,
    prs: state.prs, alarms: state.alarms, settings: state.settings
  };
  copyText(JSON.stringify(backup)) ? toast('Backup copied to clipboard') : toast('Could not copy', 'warning');
}
function openImportSheet() {
  openSheet(`
    <div class="sheet-title-row row">
      <h3 style="margin:0">Import data</h3>
      <button class="icon-button sm" onclick="closeSheet()" aria-label="Close">${ic('close')}</button>
    </div>
    <div class="field"><label for="impData">Paste a PULSE backup (JSON)</label>
      <textarea id="impData" rows="6" placeholder='{"app":"PULSE", ...}'></textarea></div>
    <button class="btn btn-primary" onclick="importData()">${ic('save')} Import</button>
    <p class="muted" style="margin-top:10px">This replaces your current workouts, history, PRs, alarms and settings.</p>`);
}
function importData() {
  try {
    const d = JSON.parse($('#impData').value);
    if (!d || typeof d !== 'object' || !Array.isArray(d.workouts)) throw new Error('bad');
    if (d.profile) state.profile = d.profile;
    state.workouts = d.workouts;
    if (Array.isArray(d.history)) state.history = d.history;
    if (d.prs) state.prs = d.prs;
    if (Array.isArray(d.alarms)) state.alarms = d.alarms;
    if (d.settings) state.settings = Object.assign(state.settings, d.settings);
    persist(); applyTheme(); closeSheet(); go('home'); toast('Data imported');
  } catch (e) { toast('Invalid backup data', 'warning'); }
}
function askResetData() {
  confirmSheet('Reset everything?', 'All workouts, history, PRs, alarms and settings will be erased. This cannot be undone.', 'Erase all data', () => {
    Object.values(LS).forEach(k => localStorage.removeItem(k));
    state.profile = { name: 'Renu Verma' }; state.workouts = defaultWorkouts();
    state.history = []; state.prs = {}; state.alarms = []; state.warmups = [];
    state.settings = { units: 'kg', sound: true, autoRest: true, restDefault: 90 };
    closeSheet(); go('home'); toast('Data reset — fresh start!');
  });
}

/* ============================================================
   SHEETS + TOASTS
   ============================================================ */
function openSheet(html) {
  $('#sheet').innerHTML = `<div class="sheet-grab"></div>` + html;
  document.body.classList.add('sheet-open');
}
function closeSheet() { document.body.classList.remove('sheet-open'); }
let _confirmCb = null;
function confirmSheet(title, msg, okLabel, cb) {
  _confirmCb = cb;
  openSheet(`
    <div style="text-align:center;padding:6px 4px 2px">
      <div style="display:inline-flex;background:var(--rose-soft);color:var(--rose-deep);width:58px;height:58px;border-radius:20px;align-items:center;justify-content:center;margin-bottom:12px">${ic('warning')}</div>
      <h3>${title}</h3>
      <p class="muted" style="margin:8px 0 20px">${msg}</p>
      <div class="row" style="gap:10px">
        <button class="btn btn-ghost" style="flex:1" onclick="closeSheet()">Cancel</button>
        <button class="btn btn-primary" style="flex:1" onclick="runConfirm()">${okLabel}</button>
      </div>
    </div>`);
}
function runConfirm() { const cb = _confirmCb; _confirmCb = null; closeSheet(); if (cb) cb(); }
function toast(msg, icoName) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="toast-ico">${ic(icoName === 'pr' ? 'pr' : icoName === 'warning' ? 'warning' : 'check')}</span><span>${msg}</span>`;
  $('#toasts').appendChild(t);
  setTimeout(() => t.classList.add('out'), 2300);
  setTimeout(() => t.remove(), 2700);
}

/* ============================================================
   INIT
   ============================================================ */
state.timer = (() => { const t = lsGet('pulse.timer', null); const d = (t && t.dur) || state.settings.restDefault || 90; return { dur: d, rem: d, running: false }; })();
applyTheme();
window.addEventListener('storage', e => { if (e.key && e.key.startsWith('pulse.')) { /* other tab changed data */ } });
render();
setInterval(checkAlarms, 20000);
checkAlarms();
</script>
</body>
</html>
