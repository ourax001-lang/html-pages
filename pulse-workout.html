<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PULSE — Workout Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Quicksand:wght@400;600;700&family=Comfortaa:wght@400;600;700&family=Baloo+2:wght@400;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PULSE — muted "sticker & squircle" design system
   Perf notes: all looping animations are transform/opacity only
   (compositor-friendly); no backdrop-filter on persistent UI;
   animation names swap per intensity level; durations/speed,
   radii and shadows are driven by CSS custom properties.
   ============================================================ */
:root{
  /* base palette (muted) */
  --cream:#FBF4E6; --white:#FFFDF6; --ink:#332F27; --soft:#7A7263; --line:#EFE6D2;
  --rose:#EBB7C1;    --rose-soft:#F7DCE0; --rose-deep:#A85A68;
  --sage:#B7CDA9;    --sage-soft:#E2EAD5; --sage-deep:#5F7A52;
  --teal:#8FBEB3;    --teal-soft:#D9EBE5; --teal-deep:#33685C;
  --mustard:#E7CB84; --must-soft:#F5E8C3; --must-deep:#8F7326;
  --lav:#C3B2DE;     --lav-soft:#E7DFF3;  --lav-deep:#6A5490;
  --sky:#AEC6DD;     --sky-soft:#E0EAF2;  --sky-deep:#4E6C86;
  --peach:#EEC49E;   --peach-soft:#F8E5CF; --peach-deep:#9A6C42;
  --brick:#C77561;
  /* ---- live theme controls (set by JS) ---- */
  --font:'Nunito','Quicksand','Baloo 2',ui-rounded,'SF Pro Rounded',system-ui,-apple-system,'Segoe UI',sans-serif;
  --rscale:1; --sh:1; --spd:1; /* roundness / shadow / speed */
  --r-xl:calc(34px * var(--rscale)); --r-lg:calc(30px * var(--rscale));
  --r-tl:calc(27px * var(--rscale)); --r-md:calc(21px * var(--rscale)); --r-sm:calc(14px * var(--rscale));
  --pop:calc(4px * var(--sh)) calc(5px * var(--sh)) 0 rgba(51,47,39,.16);
  --pop-sm:calc(3px * var(--sh)) calc(3px * var(--sh)) 0 rgba(51,47,39,.14);
  --d1:calc(2.8s / var(--spd)); --d2:calc(3.4s / var(--spd)); --d3:calc(4.2s / var(--spd));
  --d4:calc(5s / var(--spd));  --d5:calc(6.4s / var(--spd));
  /* motion level → animation-name swap (keeps keyframes var-free = GPU) */
  --wig:wiggle; --wig2:wiggle2; --bob:bobble; --squ:squish; --swy:sway; --shy:shimmy;
  --nav-h:78px;
  --border:2.5px solid var(--ink);
}
/* split accents must be real rules, not nested in :root */
.acc-push{--acc:var(--rose-deep);--acc-bg:var(--rose-soft)}
.acc-pull{--acc:var(--sage-deep);--acc-bg:var(--sage-soft)}
.acc-legs{--acc:var(--must-deep);--acc-bg:var(--must-soft)}
.acc-custom{--acc:var(--lav-deep);--acc-bg:var(--lav-soft)}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);
  background:var(--cream); color:var(--ink); min-height:100dvh; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
.ic{width:22px;height:22px;flex:none;display:block}

/* ============================================================
   MOTION — fixed-amplitude keyframes (compositor-safe), amplitude
   changed by swapping animation-name per intensity level
   ============================================================ */
@keyframes wiggle{0%,100%{transform:rotate(-.7deg)}50%{transform:rotate(.7deg)}}
@keyframes wiggle-lo{0%,100%{transform:rotate(-.3deg)}50%{transform:rotate(.3deg)}}
@keyframes wiggle-hi{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
@keyframes wiggle2{0%,100%{transform:rotate(.8deg) translateY(0)}50%{transform:rotate(-.8deg) translateY(-2px)}}
@keyframes wiggle2-lo{0%,100%{transform:rotate(.35deg)}50%{transform:rotate(-.35deg) translateY(-1px)}}
@keyframes wiggle2-hi{0%,100%{transform:rotate(1.4deg) translateY(0)}50%{transform:rotate(-1.4deg) translateY(-4px)}}
@keyframes bobble{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes bobble-lo{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes bobble-hi{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes squish{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes squish-lo{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
@keyframes squish-hi{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes sway{0%,100%{transform:rotate(0)}25%{transform:rotate(1.1deg)}75%{transform:rotate(-1.1deg)}}
@keyframes sway-lo{0%,100%{transform:rotate(0)}25%{transform:rotate(.5deg)}75%{transform:rotate(-.5deg)}}
@keyframes sway-hi{0%,100%{transform:rotate(0)}25%{transform:rotate(1.9deg)}75%{transform:rotate(-1.9deg)}}
@keyframes shimmy{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5px)}}
@keyframes shimmy-lo{0%,100%{transform:translateX(0)}50%{transform:translateX(1px)}}
@keyframes shimmy-hi{0%,100%{transform:translateX(0)}50%{transform:translateX(4.5px)}}
@keyframes twinkle{0%,100%{transform:scale(.55) rotate(0);opacity:.35}50%{transform:scale(1.1) rotate(24deg);opacity:.9}}
@keyframes twinkle-lo{0%,100%{transform:scale(.8);opacity:.55}50%{transform:scale(1);opacity:.75}}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,-30px) scale(1.14)}100%{transform:translate(0,0) scale(1)}}
@keyframes floatUp{0%{transform:translateY(14px);opacity:0}20%{opacity:.7}80%{opacity:.7}100%{transform:translateY(-70vh);opacity:0}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes softPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes popIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes confFall{to{transform:translateY(110vh) rotate(720deg);opacity:.6}}
@keyframes barUp{from{height:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(-16px) rotate(-2deg)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(-12px) scale(.94)}}

/* intensity levels */
body[data-jig="0.5"]{--wig:wiggle-lo;--wig2:wiggle2-lo;--bob:bobble-lo;--squ:squish-lo;--swy:sway-lo;--shy:shimmy-lo}
body[data-jig="1.5"]{--wig:wiggle-hi;--wig2:wiggle2-hi;--bob:bobble-hi;--squ:squish-hi;--swy:sway-hi;--shy:shimmy-hi}
body[data-jig="0"] *{animation:none!important}

/* tilt helpers (independent `rotate` property — composes with animated transform) */
.tilt-a{rotate:-1.3deg}.tilt-b{rotate:1.4deg}.tilt-c{rotate:-.7deg}.tilt-d{rotate:.8deg}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* ============================================================
   App shell + animated background overlays
   ============================================================ */
.app-shell{
  width:100%; max-width:430px; margin:0 auto; min-height:100dvh;
  background:var(--cream); position:relative; overflow:hidden;
  box-shadow:0 0 60px rgba(51,47,39,.12);
}
@media (max-width:440px){ .app-shell{box-shadow:none} }
.bg-fx{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.blob{position:absolute;border-radius:50%;opacity:.5}
.blob.bl1{width:340px;height:340px;top:-90px;left:-110px;background:radial-gradient(circle,var(--rose) 0%,rgba(235,183,193,0) 68%);animation:drift var(--d5) ease-in-out infinite}
.blob.bl2{width:380px;height:380px;top:34%;right:-160px;background:radial-gradient(circle,var(--sage) 0%,rgba(183,205,169,0) 68%);animation:drift calc(7.6s / var(--spd)) ease-in-out -8s infinite reverse}
.blob.bl3{width:300px;height:300px;bottom:-100px;left:-80px;background:radial-gradient(circle,var(--mustard) 0%,rgba(231,203,132,0) 68%);animation:drift var(--d4) ease-in-out -14s infinite}
.blob.bl4{width:220px;height:220px;top:52%;left:-90px;background:radial-gradient(circle,var(--sky) 0%,rgba(174,198,221,0) 68%);animation:drift var(--d5) ease-in-out -4s infinite}
.blob.bl5{width:180px;height:180px;top:22%;right:-40px;background:radial-gradient(circle,var(--lav) 0%,rgba(195,178,222,0) 68%);animation:drift calc(8.5s / var(--spd)) ease-in-out -11s infinite reverse}
.spark{position:absolute;width:13px;height:13px;animation:twinkle var(--d2) ease-in-out infinite;color:var(--sage-deep)}
.spark::before,.spark::after{content:'';position:absolute;left:50%;top:50%;translate:-50% -50%;background:currentColor;opacity:.5;border-radius:4px}
.spark::before{width:13px;height:4.5px}.spark::after{width:4.5px;height:13px}
.spark.s1{top:12%;right:14%}
.spark.s2{top:44%;left:7%;color:var(--rose-deep)}
.spark.s3{bottom:20%;right:8%;animation-delay:.8s;color:var(--must-deep)}
.spark.s4{top:26%;left:16%;animation-delay:1.6s;color:var(--sky-deep)}
.spark.s5{bottom:34%;left:10%;animation-delay:2.4s}
.spark.s6{top:60%;right:16%;animation-delay:3.1s;color:var(--lav-deep)}
.ringdeco{position:absolute;border:2.5px dashed rgba(51,47,39,.16);border-radius:50%;animation:spinSlow calc(26s / var(--spd)) linear infinite}
.ringdeco.r1{width:54px;height:54px;top:15%;left:60%}
.ringdeco.r2{width:34px;height:34px;bottom:26%;right:5%;animation-direction:reverse;border-color:rgba(168,90,104,.25)}
.crossdeco{position:absolute;width:16px;height:16px;animation:spinSlow calc(18s / var(--spd)) linear infinite}
.crossdeco::before,.crossdeco::after{content:'';position:absolute;left:50%;top:50%;translate:-50% -50%;background:rgba(51,47,39,.14);border-radius:3px}
.crossdeco::before{width:16px;height:5px}.crossdeco::after{width:5px;height:16px}
.crossdeco.c1{top:36%;right:26%}
.crossdeco.c2{bottom:12%;left:30%;animation-direction:reverse}
.fdot{position:absolute;bottom:-10px;width:9px;height:9px;border-radius:50%;background:var(--lav);opacity:0;animation:floatUp calc(17s / var(--spd)) linear infinite}
.fdot.f1{left:12%}.fdot.f2{left:33%;background:var(--teal);animation-delay:-3s}.fdot.f3{left:55%;background:var(--rose);animation-delay:-7s}
.fdot.f4{left:72%;background:var(--mustard);animation-delay:-11s}.fdot.f5{left:88%;background:var(--sage);animation-delay:-5s}
.fdot.f6{left:22%;background:var(--sky);animation-delay:-9s;width:6px;height:6px}
.fdot.f7{left:64%;background:var(--peach);animation-delay:-13s;width:7px;height:7px}
.fdot.f8{left:80%;background:var(--rose-deep);animation-delay:-15s;width:5px;height:5px}

.screen{
  position:relative;z-index:1;
  padding:calc(18px + env(safe-area-inset-top)) 20px calc(var(--nav-h) + 36px + env(safe-area-inset-bottom));
  animation:fadeUp .32s cubic-bezier(.2,.8,.3,1);
}
.screen.no-nav{padding-bottom:calc(52px + env(safe-area-inset-bottom))}

/* headers */
.screen-header{margin:8px 2px 16px}
.screen-header h1{font-size:28px;font-weight:800;letter-spacing:-.3px;line-height:1.12;animation:var(--swy) var(--d3) ease-in-out infinite}
.screen-header p{color:var(--soft);font-size:14.5px;font-weight:700;margin-top:4px;animation:var(--wig) var(--d3) ease-in-out infinite .3s}
.section-label{
  font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--teal-deep);margin:26px 4px 12px;display:flex;align-items:center;gap:7px;
  animation:var(--shy) var(--d2) ease-in-out infinite;
}
.section-label .ic{width:16px;height:16px;animation:var(--wig2) var(--d1) ease-in-out infinite}

/* ============================================================
   Cards — sticker style
   ============================================================ */
.card{
  background:var(--white); border-radius:var(--r-lg); padding:18px;
  border:var(--border); box-shadow:var(--pop);
  animation:var(--wig) var(--d3) ease-in-out infinite;
  transition:translate .12s ease, box-shadow .12s ease;
}
.card:active{translate:2px 3px;box-shadow:calc(1px * var(--sh)) calc(1px * var(--sh)) 0 rgba(51,47,39,.16)}
.card+.card{margin-top:14px}
.card:nth-child(2n){animation-name:var(--wig2);animation-duration:var(--d4);animation-delay:.6s}

.hero-card{
  border:var(--border); border-radius:var(--r-lg); padding:20px 20px 18px;
  box-shadow:var(--pop); position:relative; overflow:hidden;
  display:flex; align-items:center; gap:8px; rotate:-.5deg;
  background:linear-gradient(135deg,var(--sage-soft) 0%,var(--sage) 90%);
  animation:var(--wig) var(--d4) ease-in-out infinite;
}
.hero-card::after{content:'';position:absolute;right:-46px;top:-52px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.4);animation:softPulse var(--d4) ease-in-out infinite}
.hero-card::before{content:'';position:absolute;right:24px;bottom:-64px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.25);animation:softPulse var(--d5) ease-in-out -2s infinite}

.split-card{
  background:var(--white); border-radius:var(--r-md); padding:16px;
  border:var(--border); box-shadow:var(--pop-sm);
  display:flex; align-items:center; gap:14px; cursor:pointer;
  transition:translate .12s ease;
  animation:var(--wig2) var(--d3) ease-in-out infinite;
}
.split-card:active{translate:2px 2px;box-shadow:calc(1px * var(--sh)) calc(1px * var(--sh)) 0 rgba(51,47,39,.14)}
.split-card+.split-card{margin-top:14px}
.split-card h3{font-size:16.5px;font-weight:800}
.split-card .meta{font-size:12.5px;color:var(--soft);font-weight:700;margin-top:2px}
.split-ico{
  width:52px;height:52px;border-radius:var(--r-md);background:var(--acc-bg);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
  color:var(--acc);flex:none;animation:var(--bob) var(--d2) ease-in-out infinite;
}

/* split tiles — 2×2 squircle grid */
.splits-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split-tile{
  border:var(--border);border-radius:var(--r-lg);box-shadow:var(--pop);cursor:pointer;
  min-height:148px;padding:16px 15px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0;
  color:var(--ink);text-align:left;transition:translate .12s ease;
  animation:var(--wig) var(--d3) ease-in-out infinite;
}
.split-tile:active{translate:2px 3px;box-shadow:calc(1px * var(--sh)) calc(1px * var(--sh)) 0 rgba(51,47,39,.16)}
.split-tile:nth-child(2n){animation-name:var(--wig2);animation-duration:var(--d4);animation-delay:.5s}
.split-tile:nth-child(3){animation-delay:1s}
.split-tile:nth-child(4){animation-delay:1.4s}
.split-tile .st-ico{
  width:44px;height:44px;border-radius:var(--r-md);background:rgba(255,255,255,.65);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
  animation:var(--bob) var(--d2) ease-in-out infinite;
}
.split-tile h3{font-size:17px;font-weight:800;letter-spacing:.4px}
.split-tile .meta{font-size:11.5px;font-weight:700;color:var(--ink);opacity:.72;line-height:1.35}
.split-tile .st-foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.st-push{background:var(--rose)}.st-pull{background:var(--sage)}
.st-legs{background:var(--mustard)}.st-custom{background:var(--lav)}
.pill-mini{
  display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.72);
  border:2px solid var(--ink);border-radius:999px;padding:4px 10px;
  font-size:10.5px;font-weight:800;animation:var(--wig) var(--d1) ease-in-out infinite;
}

.tool-card{
  background:var(--white); border-radius:var(--r-tl); box-shadow:var(--pop-sm);
  border:var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:14px 6px; cursor:pointer; transition:translate .12s ease;
  animation:var(--squ) var(--d2) ease-in-out infinite;
}
.tool-card:active{translate:2px 2px;box-shadow:calc(1px * var(--sh)) calc(1px * var(--sh)) 0 rgba(51,47,39,.14)}
.tool-card .tool-ico{
  width:46px;height:46px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;
  border:2px solid var(--ink);animation:var(--bob) var(--d1) ease-in-out infinite;
}
.tool-card span{font-size:12px;font-weight:800}
.stat-card{
  background:var(--white); border-radius:var(--r-md); padding:14px; min-width:0;
  border:var(--border);box-shadow:var(--pop-sm);
  display:flex;flex-direction:column;gap:4px;animation:var(--wig2) var(--d3) ease-in-out infinite;
}
.stat-card:nth-child(2n){animation-name:var(--wig);animation-delay:.7s}
.stat-card .num{font-size:24px;font-weight:800;line-height:1.1;animation:var(--squ) var(--d2) ease-in-out infinite}
.stat-card .lbl{font-size:11px;font-weight:800;color:var(--soft);letter-spacing:.4px;text-transform:uppercase}

/* exercise grid — the reference "Grid View" */
.ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.ex-tile{
  border:var(--border);border-radius:var(--r-tl);box-shadow:var(--pop);
  min-height:150px;padding:14px 13px;cursor:pointer;text-align:left;min-width:0;
  display:flex;flex-direction:column;gap:7px;color:var(--ink);
  transition:translate .12s ease;animation:var(--wig) var(--d3) ease-in-out infinite;
}
.ex-tile:active{translate:2px 3px;box-shadow:calc(1px * var(--sh)) calc(1px * var(--sh)) 0 rgba(51,47,39,.16)}
.ex-tile:nth-child(2n){animation-name:var(--wig2);animation-duration:var(--d4);animation-delay:.4s}
.ex-tile:nth-child(3n){animation-delay:.9s}
.ex-tile:nth-child(4n){animation-delay:1.3s}
.ex-tile .et-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ex-tile .et-num{
  width:28px;height:28px;border-radius:var(--r-sm);background:rgba(255,255,255,.75);border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none;
  animation:var(--wig2) var(--d1) ease-in-out infinite;
}
.ex-tile .et-ico{width:26px;height:26px;color:var(--ink);opacity:.8;animation:var(--bob) var(--d2) ease-in-out infinite}
.ex-tile h4{font-size:14.5px;font-weight:800;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ex-tile .et-meta{font-size:11.5px;font-weight:800;opacity:.75}
.ex-tile .et-foot{margin-top:auto;display:flex;gap:5px;flex-wrap:wrap}
.t-rose{background:var(--rose)}.t-sage{background:var(--sage)}.t-mustard{background:var(--mustard)}
.t-lav{background:var(--lav)}.t-sky{background:var(--sky)}.t-peach{background:var(--peach)}
.ex-add{
  border-style:dashed;background:rgba(255,253,246,.6);align-items:center;justify-content:center;
  animation:var(--squ) var(--d1) ease-in-out infinite;
}
.ex-add .et-plus{
  width:44px;height:44px;border-radius:var(--r-md);background:var(--teal-soft);border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;animation:var(--wig) var(--d1) ease-in-out infinite;
}
.ex-add b{font-size:12.5px;letter-spacing:.6px}

.exercise-card{
  background:var(--white); border-radius:var(--r-md); padding:16px;
  border:var(--border);box-shadow:var(--pop-sm);animation:var(--wig) var(--d3) ease-in-out infinite;
}
.progress-card{background:var(--white);border-radius:var(--r-lg);padding:18px;border:var(--border);box-shadow:var(--pop);animation:var(--wig2) var(--d4) ease-in-out infinite}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  border-radius:999px;font-weight:800;font-size:15.5px;
  padding:15px 22px;width:100%;border:var(--border);
  transition:translate .12s ease,box-shadow .12s ease;user-select:none;
  animation:var(--squ) var(--d2) ease-in-out infinite;
}
.btn:active{translate:2px 3px;box-shadow:calc(1px * var(--sh)) calc(1px * var(--sh)) 0 rgba(51,47,39,.16)}
.btn .ic{width:19px;height:19px;animation:var(--wig) var(--d1) ease-in-out infinite}
.btn-primary,.primary-button{
  background:var(--teal-deep);color:var(--cream);box-shadow:var(--pop);
}
.btn-secondary,.secondary-button{background:var(--sage-soft);color:var(--sage-deep);box-shadow:var(--pop-sm)}
.btn-ghost{background:var(--white);color:var(--teal-deep);box-shadow:var(--pop-sm)}
.btn-danger{background:#F3D3CB;color:var(--brick);box-shadow:var(--pop-sm)}
.btn-sm{padding:10px 16px;font-size:13.5px;width:auto}
.icon-button{
  width:42px;height:42px;border-radius:50%;background:var(--white);
  border:2px solid var(--ink);box-shadow:var(--pop-sm);
  display:flex;align-items:center;justify-content:center;
  color:var(--teal-deep);transition:translate .12s ease;flex:none;
  animation:var(--bob) var(--d3) ease-in-out infinite;
}
.icon-button:active{translate:2px 2px}
.icon-button.sm{width:34px;height:34px}
.icon-button.sm .ic{width:17px;height:17px}
.pill{
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;
  padding:7px 13px;font-size:12.5px;font-weight:800;
  background:var(--acc-bg,var(--teal-soft));color:var(--acc,var(--teal-deep));
  border:2px solid var(--ink);animation:var(--wig) var(--d2) ease-in-out infinite;
}
.badge{
  display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:5px 11px;font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
  border:2px solid var(--ink);animation:var(--wig2) var(--d1) ease-in-out infinite;
}
.badge-new{background:var(--mustard);color:var(--ink)}
.badge-done{background:var(--sage);color:var(--ink)}
.chip{
  border-radius:999px;padding:9px 15px;font-size:13px;font-weight:800;
  background:var(--white);color:var(--soft);border:2px solid var(--line);
  transition:all .15s ease;white-space:nowrap;animation:var(--wig) var(--d3) ease-in-out infinite;
}
.chip.on{background:var(--teal-deep);color:var(--cream);border-color:var(--ink)}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}

/* toggle switch */
.switch{width:52px;height:30px;border-radius:999px;background:#E4DAC0;position:relative;transition:background .2s;flex:none;border:2px solid var(--ink)}
.switch::after{content:'';position:absolute;top:2.5px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.switch.on{background:var(--sage)}
.switch.on::after{transform:translateX(20px)}

/* number control */
.number-control{display:flex;align-items:center;gap:8px;background:rgba(255,253,246,.85);border:2px solid var(--ink);border-radius:999px;padding:5px;animation:var(--wig) var(--d3) ease-in-out infinite}
.number-control .nc-val{min-width:48px;text-align:center;font-weight:800;font-size:16px}
.number-control .nc-val small{font-size:10.5px;font-weight:800;color:var(--soft);margin-left:2px}
.nc-btn{
  width:36px;height:36px;border-radius:50%;background:var(--white);color:var(--teal-deep);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:19px;line-height:1;transition:translate .1s;flex:none;
}
.nc-btn:active{translate:0 2px}
.nc-input{width:58px;text-align:center;border:none;background:transparent;font-weight:800;font-size:16px;outline:none}

/* ============================================================
   Lists / rows
   ============================================================ */
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--soft);font-size:13px;font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.stack{display:flex;flex-direction:column}

/* set cards — responsive grid in live workout (never overflows) */
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.set-card{background:var(--white);border-radius:var(--r-md);padding:11px 11px;border:var(--border);box-shadow:var(--pop-sm);animation:var(--wig2) var(--d3) ease-in-out infinite;min-width:0}
.set-card.done{background:var(--sage-soft)}
.set-card .set-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:6px}
.set-card .set-name{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--soft);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-card.done .set-name{color:var(--sage-deep)}
.set-ctrls{display:flex;flex-direction:column;gap:7px}
.set-ctrls .number-control{justify-content:center;padding:3px;gap:4px;animation:none;min-width:0}
.set-ctrls .nc-btn{width:31px;height:31px;font-size:17px;flex:none}
.set-ctrls .nc-val{min-width:34px;font-size:14.5px}
.set-ctrls .nc-val small{display:none}
.set-ctrls .nc-input{flex:1;width:auto;min-width:34px;font-size:15px}
.set-ctrls .number-control small{margin-right:2px;font-size:10px}
.set-check{
  width:32px;height:32px;border-radius:11px;background:var(--must-soft);color:var(--must-deep);
  border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;flex:none;
  transition:all .15s ease;
}
.set-check .ic{width:16px;height:16px}
.set-card.done .set-check{background:var(--sage);color:var(--ink)}
.set-check:active{translate:0 2px}
@media (max-width:359px){.set-grid{grid-template-columns:1fr}}

/* big exercise hero heading */
.ex-hero{
  border:var(--border);border-radius:var(--r-lg);background:var(--white);box-shadow:var(--pop);
  padding:16px 16px 14px;margin-bottom:14px;position:relative;overflow:hidden;
  animation:var(--wig) var(--d3) ease-in-out infinite;
}
.ex-hero .ex-hero-bgic{position:absolute;right:-16px;top:-16px;width:110px;height:110px;opacity:.15;color:var(--hl,var(--teal));animation:var(--bob) var(--d3) ease-in-out infinite}
.ex-hero .ex-hero-kicker{font-size:11px;font-weight:800;letter-spacing:2.4px;color:var(--hld,var(--teal-deep));text-transform:uppercase}
.ex-hero h2{
  font-size:27px;font-weight:900;line-height:1.2;margin:5px 0 10px;color:var(--ink);
  display:inline;-webkit-box-decoration-break:clone;box-decoration-break:clone;
  background:linear-gradient(180deg,rgba(255,255,255,0) 60%,var(--hl,#EBB7C1) 60%);
  border-radius:10px;padding:0 8px;
}
.ex-hero .ex-hero-meta{display:flex;gap:6px;flex-wrap:wrap}
.ex-hero .pill-mini{background:var(--hl,#EBB7C1)}
.ex-hero .ex-notes{margin-top:10px;background:rgba(51,47,39,.05);border-radius:12px;padding:8px 11px;font-size:12.5px;font-weight:700;color:var(--soft)}

/* warm-up videos */
.wu-video{width:100%;display:block;border-radius:16px;border:2.5px solid var(--ink);background:#221f1a;aspect-ratio:16/10;object-fit:contain}
.wu-name{font-size:14px;font-weight:800}

/* exercise chips in live mode */
.ex-chip{
  border-radius:18px;padding:10px 14px;background:var(--white);box-shadow:var(--pop-sm);
  border:2px solid var(--line);font-size:12.5px;font-weight:800;color:var(--soft);
  white-space:nowrap;animation:var(--wig) var(--d3) ease-in-out infinite;transition:translate .1s;
}
.ex-chip.on{background:var(--acc-bg);color:var(--acc);border-color:var(--ink)}
.ex-chip .ex-chip-sub{font-size:10px;font-weight:700;opacity:.75;margin-top:1px}

/* ============================================================
   Bottom nav (no backdrop-filter = smooth scrolling behind it)
   ============================================================ */
.bottom-nav{
  position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
  width:min(402px, calc(100% - 28px));
  background:rgba(255,253,246,.97);
  border:var(--border);border-radius:999px;box-shadow:0 8px 24px rgba(51,47,39,.22);
  display:flex;padding:8px;z-index:60;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:7px 0;border-radius:999px;color:var(--soft);transition:color .15s;
}
.nav-item span{font-size:10px;font-weight:800;letter-spacing:.4px}
.nav-item .ic{width:23px;height:23px;animation:var(--bob) var(--d1) ease-in-out infinite}
.nav-item:nth-child(2) .ic{animation-delay:.3s}
.nav-item:nth-child(3) .ic{animation-delay:.6s}
.nav-item:nth-child(4) .ic{animation-delay:.9s}
.nav-item.on{color:var(--rose-deep)}
.nav-item.on .nav-ico{background:var(--rose);border-color:var(--ink);animation:var(--wig) var(--d1) ease-in-out infinite}
.nav-ico{padding:4px 16px;border-radius:999px;transition:background .2s;border:2px solid transparent}
body.hide-nav .bottom-nav{display:none}

/* ============================================================
   Sheets / modals
   ============================================================ */
.sheet-backdrop{
  position:fixed;inset:0;background:rgba(51,47,39,.4);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:80;
}
.bottom-sheet{
  position:fixed;left:50%;transform:translate(-50%,105%);bottom:0;
  width:min(430px,100%);
  background:var(--cream);border:var(--border);border-bottom:none;
  border-radius:var(--r-xl) var(--r-xl) 0 0;z-index:90;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;transition:transform .32s cubic-bezier(.32,.72,.35,1);
  -webkit-overflow-scrolling:touch;
}
body.sheet-open .sheet-backdrop{opacity:1;pointer-events:auto}
body.sheet-open .bottom-sheet{transform:translate(-50%,0)}
.sheet-grab{width:44px;height:6px;border-radius:99px;background:#D9CDA9;margin:4px auto 14px;animation:var(--squ) var(--d1) ease-in-out infinite}
.sheet h3{font-size:20px;font-weight:800;margin-bottom:4px;animation:var(--wig) var(--d3) ease-in-out infinite}
.modal .sheet-title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}

/* form */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--soft);margin-bottom:7px}
.field input,.field select,.field textarea{
  width:100%;border:2px solid var(--line);background:var(--white);border-radius:var(--r-sm);padding:13px 15px;
  outline:none;transition:border-color .15s;font-weight:700;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--teal)}
.field textarea{resize:vertical;min-height:70px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* range sliders */
.slider-row{margin-bottom:18px}
.slider-row .sr-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.slider-row .sr-head b{font-size:14px}
.slider-row .sr-head span{font-size:12px;font-weight:800;color:var(--soft)}
input[type="range"]{
  -webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;
}
input[type="range"]::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:var(--white);border:2px solid var(--ink)}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--teal);
  border:2.5px solid var(--ink);margin-top:-11px;box-shadow:2px 2px 0 rgba(51,47,39,.2);
}
input[type="range"]::-moz-range-track{height:12px;border-radius:99px;background:var(--white);border:2px solid var(--ink)}
input[type="range"]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--teal);border:2.5px solid var(--ink)}

/* theme swatches + fonts */
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:6px}
.swatch{
  width:100%;aspect-ratio:1;border-radius:50%;border:2.5px solid var(--ink);cursor:pointer;
  animation:var(--wig) var(--d2) ease-in-out infinite;transition:translate .1s;position:relative;
}
.swatch:active{translate:0 2px}
.swatch.on::after{content:'';position:absolute;inset:-7px;border-radius:50%;border:2.5px dashed var(--teal-deep)}
.font-row{
  display:flex;align-items:center;gap:12px;background:var(--white);border:2px solid var(--line);
  border-radius:var(--r-sm);padding:11px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;
  animation:var(--wig) var(--d3) ease-in-out infinite;
}
.font-row.on{border-color:var(--ink);background:var(--teal-soft)}
.font-row .fprev{font-size:19px;font-weight:800;flex:none;width:46px}
.font-row .fname{font-size:13px;font-weight:800;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* exercise library list */
.ex-lib{display:flex;flex-wrap:wrap;gap:7px;min-height:44px;margin-bottom:6px}

/* day pills */
.day-pills{display:flex;gap:6px}
.day-pill{
  flex:1;padding:9px 0;border-radius:13px;background:var(--white);box-shadow:var(--pop-sm);
  border:2px solid var(--ink);font-size:12px;font-weight:800;color:var(--soft);text-align:center;
  animation:var(--wig) var(--d2) ease-in-out infinite;
}
.day-pill.on{background:var(--sage);color:var(--ink)}

/* alarm rows */
.alarm-row{
  display:flex;align-items:center;gap:12px;background:var(--white);border-radius:var(--r-md);
  padding:16px;border:var(--border);box-shadow:var(--pop-sm);margin-bottom:12px;animation:var(--wig2) var(--d4) ease-in-out infinite;
}
.alarm-row .time{font-size:23px;font-weight:800;letter-spacing:.5px;animation:var(--squ) var(--d2) ease-in-out infinite}
.alarm-row.off{opacity:.55}

/* ============================================================
   Toast
   ============================================================ */
.toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(340px,calc(100% - 40px));pointer-events:none}
.toast{
  background:var(--ink);color:var(--cream);border-radius:18px;padding:13px 16px;font-size:14px;font-weight:700;
  display:flex;align-items:center;gap:10px;border:2px solid var(--ink);
  box-shadow:3px 4px 0 rgba(51,47,39,.25);animation:toastIn .35s cubic-bezier(.34,1.4,.64,1);
}
.toast .toast-ico{width:30px;height:30px;border-radius:10px;background:var(--sage);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--cream)}
.toast .toast-ico .ic{width:16px;height:16px;animation:var(--wig2) var(--d1) ease-in-out infinite}
.toast.out{animation:toastOut .3s forwards}

/* ============================================================
   Timer circle
   ============================================================ */
.timer-circle{position:relative;width:230px;height:230px;margin:0 auto;display:flex;align-items:center;justify-content:center;animation:var(--squ) var(--d3) ease-in-out infinite}
.timer-circle svg{position:absolute;inset:0;transform:rotate(-90deg)}
.timer-circle .tc-bg{fill:none;stroke:rgba(255,255,255,.55);stroke-width:13}
.timer-circle .tc-ring{fill:none;stroke:#fff;stroke-width:13;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.timer-circle .tc-val{font-size:52px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums;animation:var(--wig) var(--d2) ease-in-out infinite}
.timer-circle .tc-sub{position:absolute;bottom:34px;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;opacity:.75}

/* rest + complete overlays */
.rest-overlay,.celebrate-overlay,.alarm-overlay{
  position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;flex-direction:column;
  text-align:center;padding:24px;
}
.rest-overlay.show,.celebrate-overlay.show,.alarm-overlay.show{display:flex;animation:fadeUp .3s ease}
.rest-overlay{background:linear-gradient(170deg,var(--sage),var(--teal))}
.rest-overlay .tc-val,.alarm-overlay .tc-val{color:#fff}
.rest-overlay .timer-circle .tc-bg{stroke:rgba(255,255,255,.4)}
.celebrate-overlay{background:rgba(40,36,28,.55)}
.celebrate-card{
  background:var(--cream);border:var(--border);border-radius:var(--r-xl);padding:28px 24px;width:min(360px,92vw);
  box-shadow:6px 8px 0 rgba(20,18,14,.35);animation:popIn .45s cubic-bezier(.34,1.45,.64,1);
  text-align:center;max-height:88dvh;overflow-y:auto;position:relative;
}
.alarm-overlay{background:linear-gradient(170deg,var(--rose-soft),var(--rose))}

/* confetti */
.confetti{position:absolute;top:-12px;width:10px;height:14px;border-radius:4px;border:1.5px solid rgba(51,47,39,.25);animation:confFall linear forwards}

/* ============================================================
   Charts
   ============================================================ */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar-col .bar-lbl{font-size:11px;font-weight:800;color:var(--soft)}
.bar{width:100%;max-width:34px;border-radius:9px 9px 5px 5px;border:2px solid var(--ink);min-height:8px;background:var(--sage);transition:height .5s cubic-bezier(.34,1.3,.64,1);animation:barUp .6s cubic-bezier(.34,1.3,.64,1) backwards}
.bar.hot{background:var(--rose)}
.legend{display:flex;flex-wrap:wrap;gap:10px}
.legend .lg{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--soft)}
.legend .dot{width:12px;height:12px;border-radius:4px;border:2px solid var(--ink);animation:var(--wig2) var(--d1) ease-in-out infinite}
.hist-item{
  background:var(--white);border-radius:var(--r-md);padding:15px;border:var(--border);
  box-shadow:var(--pop-sm);margin-bottom:12px;cursor:pointer;transition:translate .15s;animation:var(--wig) var(--d3) ease-in-out infinite;
}
.hist-item:active{translate:2px 2px}
.hist-item:nth-child(2n){animation-name:var(--wig2);animation-delay:.6s}
.ring-wrap{position:relative;width:150px;height:150px;margin:0 auto}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-mid b{font-size:30px;font-weight:800;animation:var(--squ) var(--d2) ease-in-out infinite}
.ring-mid span{font-size:11px;font-weight:800;color:var(--soft);letter-spacing:1px;text-transform:uppercase}

/* PR rows */
.pr-row{
  display:flex;align-items:center;gap:13px;background:var(--white);border-radius:var(--r-md);
  padding:13px 15px;border:var(--border);box-shadow:var(--pop-sm);margin-bottom:11px;animation:var(--wig2) var(--d3) ease-in-out infinite;
}
.pr-row:nth-child(2n){animation-name:var(--wig);animation-delay:.5s}
.pr-row .pr-ico{width:44px;height:44px;border-radius:var(--r-md);background:var(--mustard);color:var(--ink);display:flex;align-items:center;justify-content:center;flex:none;border:2px solid var(--ink);animation:var(--bob) var(--d2) ease-in-out infinite}

/* empty state */
.empty{padding:36px 16px;text-align:center}
.empty h4{font-size:17px;font-weight:800;margin-top:14px;animation:var(--wig) var(--d3) ease-in-out infinite}
.empty p{color:var(--soft);font-size:13.5px;font-weight:600;margin:6px 0 18px}

/* misc */
.kv{display:flex;justify-content:space-between;font-size:14px;font-weight:700;padding:7px 0}
.kv span:first-child{color:var(--soft)}
.cat-bob{animation:bob var(--d2) ease-in-out infinite}
.pulse-ring{animation:softPulse calc(1.6s / var(--spd)) ease-in-out infinite}
.tap{cursor:pointer}
.divider{height:2px;background:var(--line);border-radius:99px;margin:14px 0}
ul.plain{list-style:none}
.big-num{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.center{text-align:center}
</style>
</head>
<body>
<div class="app-shell" id="app"></div>
<div id="sheetBackdrop" class="sheet-backdrop" onclick="closeSheet()"></div>
<div id="sheet" class="bottom-sheet" role="dialog" aria-modal="true"></div>
<div id="restOverlay" class="rest-overlay"></div>
<div id="completeOverlay" class="celebrate-overlay"></div>
<div id="alarmOverlay" class="alarm-overlay"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script>
/* ============================================================
   PULSE — Workout Tracker
   Single-file app. All state lives in localStorage.
   ============================================================ */

/* ---------- utils ---------- */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const uid = () => 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad2 = n => String(n).padStart(2, '0');
const fmt12 = (hh, mm) => { const h = hh % 12 || 12; return h + ':' + pad2(mm) + ' ' + (hh < 12 ? 'AM' : 'PM'); };
const isoDay = (d = new Date()) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const prettyDate = (d = new Date()) => d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
const fmtVol = v => Math.round(v).toLocaleString('en-IN');
const fmtDur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); return h ? h + 'h ' + m + 'm' : m + ' min'; };

/* ---------- cat illustration system (one coherent family) ---------- */
function cat(type, size = 120, cls = '') {
  const head = `<circle cx="60" cy="52" r="31" fill="#fff" stroke="#171717" stroke-width="3"/>
    <path d="M38 37 31 13l22 13z" fill="#fff" stroke="#171717" stroke-width="3" stroke-linejoin="round"/>

    <path d="M38.5 32 34.5 19l10 6z" fill="#F9B8C6"/>
    <path d="M81.5 32 85.5 19l-10 6z" fill="#F9B8C6"/>`;
  const eyesOpen   = `<circle cx="49" cy="51" r="3.4" fill="#171717"/><circle cx="71" cy="51" r="3.4" fill="#171717"/>`;
  const eyesClosed = `<path d="M45 51.5q4 3.4 8 0M67 51.5q4 3.4 8 0" stroke="#171717" stroke-width="2.6" fill="none" stroke-linecap="round"/>`;
  const eyesHappy  = `<path d="M45.5 52q3.5-4.4 7 0M67.5 52q3.5-4.4 7 0" stroke="#171717" stroke-width="2.8" fill="none" stroke-linecap="round"/>`;
  const blush = `<ellipse cx="42" cy="60" rx="5.6" ry="3.4" fill="#F9B8C6" opacity=".85"/><ellipse cx="78" cy="60" rx="5.6" ry="3.4" fill="#F9B8C6" opacity=".85"/>`;
  const mouthSmile = `<path d="M55 60.5q2.6 3 5 0M60 60.5q2.4 3 5 0" stroke="#171717" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  const mouthOpen  = `<path d="M55 60.5q5 6 10 0z" fill="#F36F91"/>`;
  const body = `<path d="M38 116c-3-22 2-34 22-34s25 12 22 34z" fill="#fff" stroke="#171717" stroke-width="3" stroke-linejoin="round"/>
    <path d="M40 112c4-3 9-4.5 20-4.5s16 1.5 20 4.5" stroke="#BFE5D5" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  const tail = `<path d="M85 108c14-1 17-12 11-17" stroke="#171717" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  let extra = '', eyes = eyesOpen, mouth = mouthSmile, tailOn = true, bodyOn = true;
  switch (type) {
    case 'main': // headphones + dumbbell
      extra = `<path d="M31 46c0-18 13-28 29-28s29 10 29 28" stroke="#238C7E" stroke-width="6" fill="none" stroke-linecap="round"/>
        <rect x="22" y="42" width="12" height="18" rx="6" fill="#BFE5D5" stroke="#171717" stroke-width="3"/>
        <rect x="86" y="42" width="12" height="18" rx="6" fill="#BFE5D5" stroke="#171717" stroke-width="3"/>`;
      break;
    case 'resting':
      eyes = eyesClosed; mouth = mouthSmile;
      extra = `<text x="92" y="26" font-size="13" font-weight="800" fill="#17685F" font-family="inherit">z</text>
        <text x="100" y="16" font-size="10" font-weight="800" fill="#17685F" font-family="inherit">z</text>`;
      break;
    case 'celebrate':
      eyes = eyesHappy; mouth = mouthOpen;
      extra = `<path d="M34 100c-8-4-12-12-11-20M86 100c8-4 12-12 11-20" stroke="#171717" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="14" cy="30" r="4" fill="#F6D66A"/><circle cx="106" cy="24" r="5" fill="#F36F91"/><circle cx="100" cy="106" r="4" fill="#D8C7E8"/><circle cx="18" cy="96" r="4.5" fill="#BFE5D5"/>
        <path d="M8 60l3 6 6 1-4.5 4.5 1 6.5L8 75l-5.5 3 1-6.5L-1 67l6-1z" fill="#F6D66A"/>`;
      break;
    case 'hydration':
      extra = `<path d="M92 96h14l-2 18H94z" fill="#CDE9F5" stroke="#171717" stroke-width="3" stroke-linejoin="round"/>
        <path d="M95.5 100h7" stroke="#8FCBE8" stroke-width="3" stroke-linecap="round"/>
        <path d="M50 100c-4-2-6-5-5-9" stroke="#171717" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      eyes = eyesHappy;
      break;
    case 'recovery':
      eyes = eyesClosed; tailOn = true;
      extra = `<ellipse cx="60" cy="108" rx="52" ry="9" fill="#fff" stroke="#171717" stroke-width="3"/>
        <path d="M92 30l4-8M96 38l8-4M84 24l0-9" stroke="#17685F" stroke-width="2.6" stroke-linecap="round"/>`;
      break;
    case 'strong':
      eyes = eyesHappy; mouth = mouthSmile;
      extra = `<path d="M30 94c-6-8-6-18 0-26" stroke="#171717" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path d="M90 94c6-8 6-18 0-26" stroke="#171717" stroke-width="3" fill="none" stroke-linecap="round"/>
        <rect x="10" y="62" width="14" height="8" rx="3" fill="#F36F91" stroke="#171717" stroke-width="2.6"/>
        <rect x="96" y="62" width="14" height="8" rx="3" fill="#F36F91" stroke="#171717" stroke-width="2.6"/>
        <path d="M24 66h72" stroke="#171717" stroke-width="2.6"/>`;
      break;
    case 'trophy':
      eyes = eyesHappy; mouth = mouthOpen;
      extra = `<path d="M46 14h28v14a14 14 0 0 1-28 0z" fill="#F6D66A" stroke="#171717" stroke-width="3"/>
        <path d="M46 17H34v4a9 9 0 0 0 9 9M74 17h12v4a9 9 0 0 1-9 9M60 42v8M50 54h20l-2-4H52z" fill="none" stroke="#171717" stroke-width="3" stroke-linecap="round"/>`;
      break;
    case 'profile':
    default:
      extra = `<path d="M50 6l3 5-4 4 5 1" stroke="#17685F" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg class="cat-ill ${cls}" width="${size}" height="${size}" viewBox="0 0 120 120" fill="none" aria-hidden="true">
    ${bodyOn ? body : ''}${tailOn ? tail : ''}${head}${eyes}${blush}${mouth}${extra}
  </svg>`;
}

  pull:   { label: 'PULL',   cls: 'acc-pull',   icon: 'workout', parts: 'Back · Biceps' },
  legs:   { label: 'LEGS',   cls: 'acc-legs',   icon: 'workout', parts: 'Quads · Hamstrings · Calves' },
  custom: { label: 'CUSTOM', cls: 'acc-custom', icon: 'sets',    parts: 'Your own mix' }
};
const splitMeta = s => SPLIT_META[s] || SPLIT_META.custom;

/* ---------- units ---------- */
const isKg = () => state.settings.units !== 'lb';
const toKg = v => isKg() ? v : (v / 2.20462);
const fmtW = kg => { const v = isKg() ? kg : kg * 2.20462; return Math.round(v * 10) / 10; };
const wU = () => isKg() ? 'kg' : 'lb';

/* ---------- derived ---------- */
const totalWorkouts = () => state.history.length;
const level = () => 1 + Math.floor(totalWorkouts() / 4);
const sumSets = w => (w.exercises || []).reduce((a, e) => a + (+e.sets || 0), 0);
function calcStreak() {
  const days = new Set(state.history.map(h => h.iso));
  const d = new Date();
  if (!days.has(isoDay(d))) d.setDate(d.getDate() - 1);
  if (!days.has(isoDay(d))) return 0;
  let n = 0;
  while (days.has(isoDay(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function todaysWorkout() {
  const order = ['push', 'pull', 'legs'];
  const done = state.history.map(h => h.split).filter(s => order.includes(s));
  const next = done.length ? order[(order.indexOf(done[done.length - 1]) + 1) % 3] : 'push';
  return state.workouts.find(w => w.split === next) || state.workouts[0];
}
const lastTrained = split => {
  const h = state.history.filter(h => h.split === split);
  return h.length ? h[h.length - 1].dateLabel : 'Never';
};

/* ---------- sound (WebAudio, local only) ---------- */
let _actx = null;
const actx = () => (_actx = _actx || new (window.AudioContext || window.webkitAudioContext)());
function beep(freq = 880, dur = 0.14, when = 0, vol = 0.18) {
  if (!state.settings.sound) return;
  try {
    const c = actx(), o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime + when);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + when + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + when); o.stop(c.currentTime + when + dur + 0.02);
  } catch (e) {}
}
const chime = () => { beep(660, .16, 0); beep(880, .18, .16); beep(1100, .22, .34); };
</script>

/* ============================================================
   WARM-UP — videos stored locally in IndexedDB (blobs are too
   big for localStorage). Always shown before a workout starts.
   ============================================================ */
let _idb = null;
function db() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') { reject(new Error('no idb')); return; }
    const req = indexedDB.open('pulse-warmups', 1);
    req.onupgradeneeded = e => { const d = e.target.result; if (!d.objectStoreNames.contains('videos')) d.createObjectStore('videos'); };
    req.onsuccess = e => { _idb = e.target.result; resolve(_idb); };
    req.onerror = () => reject(req.error);
  });
}
const dbPut = (k, blob) => db().then(d => new Promise((res, rej) => {
  const tx = d.transaction('videos', 'readwrite'); tx.objectStore('videos').put(blob, k);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const dbGet = k => db().then(d => new Promise((res, rej) => {
  const tx = d.transaction('videos', 'readonly'); const r = tx.objectStore('videos').get(k);
  r.onsuccess = () => res(r.result || null); r.onerror = () => rej(r.error);
}));
const dbDel = k => db().then(d => new Promise((res, rej) => {
  const tx = d.transaction('videos', 'readwrite'); tx.objectStore('videos').delete(k);
  tx.oncomplete = res; tx.onerror = () => rej(tx.error);
}));
const _wuURLs = new Map();   /* id -> objectURL cache */

    }

}

/* ============================================================

let _liveTick = null, _restTick = null;
function startWorkout(id) {

  stopTimers();
  /* prefill with last weights actually used for each exercise */
  const lastW = {};
  for (let i = state.history.length - 1; i >= 0; i--) {
    state.history[i].exercises.forEach(e => {
      const s = e.sets[e.sets.length - 1];
      if (s && !(e.name in lastW)) lastW[e.name] = s.weight;
    });
  }
  state.active = {
    wid: w.id, name: w.name, split: w.split, start: Date.now(), newPRs: [], cur: 0,
    exercises: w.exercises.map(e => ({

}

/* ---------- PR logic ---------- */
function checkSetPR(exName, reps, weight) {
  const pr = state.prs[exName];
  const a = state.active;
  if (!pr) {
    state.prs[exName] = { weight, weightDate: isoDay(), reps, repsDate: isoDay(), volume: 0, volumeDate: null, bestSet: { w: weight, r: reps }, bestSetDate: isoDay() };
    return;
  }
  let hit = false;
  if (weight > pr.weight) { pr.weight = weight; pr.weightDate = isoDay(); hit = true; }
  if (reps > pr.reps) { pr.reps = reps; pr.repsDate = isoDay(); hit = true; }
  if (weight * reps > (pr.bestSet.w * pr.bestSet.r || 0)) { pr.bestSet = { w: weight, r: reps }; pr.bestSetDate = isoDay(); hit = true; }
  if (hit && a) {
    a.newPRs.push(exName);
    chime(); toast('New PR! ' + exName, 'pr');
    showCelebration(exName);
  }
}
function showCelebration(exName) {
  const ov = $('#completeOverlay');
  ov.innerHTML = `<div class="celebrate-card" style="position:relative;overflow:hidden">
    ${confettiHTML(18)}
    ${cat('celebrate', 120)}
    <h2 style="font-size:22px;margin-top:8px">New Personal Record!</h2>
    <p class="muted" style="margin:4px 0 16px">${esc(exName)} — new personal record</p>

  let h = '';
  for (let i = 0; i < n; i++) {
    h += `<span class="confetti" style="left:${Math.random() * 100}%;background:${cols[i % 5]};animation-duration:${2.2 + Math.random() * 2}s;animation-delay:${Math.random() * .8}s"></span>`;
  }
  return h;
}

/* ---------- finish + summary ---------- */
function finishWorkout() {
  const a = state.active;
  if (!a) { closeSheet(); go('home'); return; }
  closeSheet(); stopTimers();
  const duration = Math.round((Date.now() - a.start) / 1000);
  let sets = 0, volume = 0;
  const exOut = a.exercises.map(e => {
    const doneSets = e.sets.filter(s => s.done && s.reps != null);
    sets += doneSets.length;
    const exVol = doneSets.reduce((s2, s) => s2 + s.reps * s.weight, 0);
    volume += exVol;
    // volume PR
    const pr = state.prs[e.name];
    if (pr && exVol > (pr.volume || 0)) { pr.volume = exVol; pr.volumeDate = isoDay(); }
    return { name: e.name, targetReps: e.targetReps, sets: doneSets.map(s => ({ reps: s.reps, weight: s.weight })) };
  });
  const entry = {
    id: uid(), ts: Date.now(), iso: isoDay(), dateLabel: prettyDate(),
    name: a.name, split: a.split, duration, sets, volume, prCount: a.newPRs.length,
    prNames: [...new Set(a.newPRs)], exercises: exOut
  };
  state.history.push(entry);
  state.profile.lastWorkout = isoDay();
  persist();
  state.active = null;
  showSummary(entry);
}
